name: Build DistanceUprav APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid android-actions/setup-android@v3: its legacy "tools" package
      # installation fails with "Failed to find package 'tools'".
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent development signing key
        shell: bash
        run: |
          base64 --decode app/debug-signing.keystore.b64 > app/debug.keystore
          chmod 600 app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Test network routing and MAC helpers
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DistanceUprav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
